<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Ilustración de rascador compacto para gato con poste de sisal y pelota colgante">
  <defs>
    <linearGradient id="bgScratcher" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF5F3"/>
      <stop offset="100%" stop-color="#D7ECE8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="url(#bgScratcher)"/>
  <circle cx="316" cy="70" r="44" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="200" cy="236" rx="116" ry="15" fill="#1E4D4F" opacity="0.15"/>
  <!-- Base de felpa -->
  <rect x="108" y="204" width="184" height="28" rx="12" fill="#1E4D4F"/>
  <rect x="116" y="208" width="168" height="8" rx="4" fill="#2D7174"/>
  <!-- Poste de cuerda sisal -->
  <rect x="176" y="88" width="48" height="118" rx="8" fill="#D9A86C"/>
  <g stroke="#B88346" stroke-width="4" stroke-linecap="round">
    <line x1="178" y1="102" x2="222" y2="108"/>
    <line x1="178" y1="116" x2="222" y2="122"/>
    <line x1="178" y1="130" x2="222" y2="136"/>
    <line x1="178" y1="144" x2="222" y2="150"/>
    <line x1="178" y1="158" x2="222" y2="164"/>
    <line x1="178" y1="172" x2="222" y2="178"/>
    <line x1="178" y1="186" x2="222" y2="192"/>
  </g>
  <!-- Plataforma superior -->
  <rect x="132" y="68" width="136" height="24" rx="12" fill="#1E4D4F"/>
  <rect x="142" y="72" width="116" height="7" rx="3.5" fill="#2D7174"/>
  <!-- Cuerda y pelota colgante -->
  <path d="M250 92c8 18 14 34 8 52" fill="none" stroke="#9A6C39" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="154" r="14" fill="#D96B27"/>
  <circle cx="251" cy="149" r="4" fill="#F4A574"/>
</svg>
