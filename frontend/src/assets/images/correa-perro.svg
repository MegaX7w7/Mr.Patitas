    <path d="M14 -6h20a10 10 0 0 1 0 20H14" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <circle cx="6" cy="0" r="3" fill="#94A3B8"/>
  </g>
  <!-- Detalle huella decorativa -->
  <g transform="translate(298 205)" fill="#D96B27" opacity="0.85">
    <circle cx="-10" cy="-10" r="4.5"/>
    <circle cx="0" cy="-14" r="4.5"/>
    <circle cx="10" cy="-10" r="4.5"/>
    <ellipse cx="0" cy="0" rx="10" ry="7.5"/>
