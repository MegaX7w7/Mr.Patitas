<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Ilustración de correa resistente para perro con mosquetón metálico">
  <defs>
    <linearGradient id="bgLeash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF6E8"/>
      <stop offset="100%" stop-color="#F6E5C8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="url(#bgLeash)"/>
  <circle cx="322" cy="70" r="46" fill="#FFFFFF" opacity="0.55"/>
  <ellipse cx="200" cy="236" rx="120" ry="14" fill="#1E4D4F" opacity="0.12"/>
  <!-- Asa y cinta de la correa -->
  <path d="M115 98c0-28 24-46 52-46s48 20 48 48c0 34-40 48-78 66-26 12-30 42 6 48 42 7 96-16 124-48" fill="none" stroke="#1E4D4F" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M115 98c0-28 24-46 52-46s48 20 48 48c0 34-40 48-78 66-26 12-30 42 6 48 42 7 96-16 124-48" fill="none" stroke="#2D7174" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round"/>
  <!-- Empuñadura acolchada -->
  <path d="M126 62c12-10 34-14 54-8" fill="none" stroke="#D96B27" stroke-width="24" stroke-linecap="round"/>
  <!-- Costura conector -->
  <rect x="252" y="148" width="28" height="22" rx="6" transform="rotate(-42 266 159)" fill="#D96B27"/>
  <!-- Mosquetón metálico -->
  <g transform="translate(290 134) rotate(-42)">
